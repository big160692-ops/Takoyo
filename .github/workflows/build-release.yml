name: Build & Release Takoyo

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v2.2.1)'
        required: true
        type: string
      name:
        description: 'Release name (e.g., Octo)'
        required: false
        type: string

permissions:
  contents: write

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}
  VERSION_NAME: ${{ github.event.inputs.name || 'Release' }}
  QT_VERSION: '6.8.3'
  MINGW_VERSION: '13.1.0'

jobs:
  build-windows:
    name: Build Windows (MinGW)
    runs-on: windows-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          target: desktop
          host: windows
          arch: win64_mingw
          toolchain: mingw
          modules: 'qtcharts qtsvg qtnetworkauth'
          setup-python: false
      
      - name: Setup MinGW
        uses: egor-tensin/setup-mingw@v2
        with:
          version: ${{ env.MINGW_VERSION }}
          platform: x64
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller pillow psutil requests charset-normalizer numpy
      
      - name: Configure CMake
        working-directory: ./native
        env:
          PATH: ${{ env.QT_BIN }};${{ env.MINGW_BIN }};${{ env.PATH }}
        run: |
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
      
      - name: Build Native App
        working-directory: ./native
        env:
          PATH: ${{ env.QT_BIN }};${{ env.MINGW_BIN }};${{ env.PATH }}
        run: |
          cmake --build build --config Release
      
      - name: Deploy Qt Dependencies
        working-directory: ./native
        env:
          PATH: ${{ env.QT_BIN }};${{ env.MINGW_BIN }};${{ env.PATH }}
        run: |
          $nativeExe = "build/bin/TakoyoNative.exe"
          windeployqt --release --no-translations $nativeExe
          
          # Copy to dist
          Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item -Recurse build/bin/* dist/
      
      - name: Build Python Engine
        working-directory: ./native
        run: |
          python -m PyInstaller --clean --noconfirm TakoyoEngine.spec
          New-Item -ItemType Directory engine-dist -Force | Out-Null
          Copy-Item dist/TakoyoEngine.exe engine-dist/
      
      - name: Build Single Executable
        working-directory: ./native
        env:
          PATH: ${{ env.QT_BIN }};${{ env.MINGW_BIN }};${{ env.PATH }}
          MINGW_BIN: ${{ env.MINGW_BIN }}
        run: |
          python pack_single.py
      
      - name: Build Smart Installer
        working-directory: ./native/launcher
        env:
          PATH: ${{ env.MINGW_BIN }};${{ env.PATH }}
        run: |
          g++ -O2 -s -municode -mwindows -static installer_launcher.cpp -o installer_launcher.exe -luser32 -lshell32 -lshlwapi
      
      - name: Package Installer
        working-directory: ./
        run: |
          $stage = "installer_package"
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory $stage | Out-Null
          
          Copy-Item native/launcher/installer_launcher.exe "$stage/Takoyo-Setup-$env:VERSION-$env:VERSION_NAME.exe"
          Copy-Item smart_installer.py "$stage/smart_installer.py"
          Copy-Item native/single/Takoyo.exe "$stage/Takoyo.exe"
          
          $readme = @"
  # Takoyo $env:VERSION "$env:VERSION_NAME" Installer Package
  ...
  "@
          Set-Content "$stage/README.txt" -Value $readme -Encoding utf8
          
          Compress-Archive -Path "$stage\*" -DestinationPath "Takoyo-$env:VERSION-$env:VERSION_NAME-installer.zip" -Force
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ env.VERSION }}
          name: "Takoyo ${{ env.VERSION }} ${{ env.VERSION_NAME }}"
          body_path: RELEASE_NOTES.md
          files: |
            native/single/Takoyo.exe
            Takoyo-${{ env.VERSION }}-${{ env.VERSION_NAME }}-installer.zip
            native/engine-dist/TakoyoEngine.exe
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build Linux (AppImage)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-tools-dev libqt6svg6-dev \
            cmake g++ python3 python3-pip python3-venv \
            patchelf desktop-file-utils libfuse2
      
      - name: Setup Python venv
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install pyinstaller pillow psutil requests charset-normalizer numpy
      
      - name: Build Native App
        working-directory: ./native
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
      
      - name: Build Python Engine
        working-directory: ./native
        run: |
          source ../venv/bin/activate
          python -m PyInstaller --clean --noconfirm TakoyoEngine.spec
      
      - name: Create AppDir
        working-directory: ./native
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/lib
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          
          cp build/bin/TakoyoNative AppDir/usr/bin/
          cp dist/TakoyoEngine AppDir/usr/bin/
          cp -r ../assets AppDir/usr/share/takoyo/
          
          # Create desktop file
          cat > AppDir/usr/share/applications/takoyo.desktop << 'EOF'
  [Desktop Entry]
  Type=Application
  Name=Takoyo
  Comment=AI Agent with local models
  Exec=TakoyoNative
  Icon=takoyo
  Categories=Development;Utility;
  EOF
          
          cp ../assets/takoyo.ico AppDir/usr/share/icons/hicolor/256x256/apps/takoyo.png 2>/dev/null || true
      
      - name: Build AppImage
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage native/AppDir Takoyo-${{ env.VERSION }}-${{ env.VERSION_NAME }}-linux-x86_64.AppImage
      
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Takoyo-linux
          path: Takoyo-*-linux-x86_64.AppImage
          retention-days: 30

  checksums:
    name: Generate Checksums
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Generate SHA256
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      
      - name: Upload Checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: artifacts/SHA256SUMS.txt
      
      - name: Attach to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          files: artifacts/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}